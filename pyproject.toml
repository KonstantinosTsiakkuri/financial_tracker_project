[project]
name = "financial-tracker"
version = "0.1.0"
description = ""
authors = [
    {name = "olasp",email = "olaspain@BK.RU"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "black (>=26.3.1,<27.0.0)",
    "mypy (>=1.19.1,<2.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "requests (>=2.33.0,<3.0.0)",
    "types-requests (>=2.33.0.20260327,<3.0.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.black]
line-length = 119
target-version = ["py313"]